<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kherwal Bazaar QR Payment Poster</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,900&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #111;
        }
        .poster-bg {
            background: linear-gradient(135deg, #e6005c 0%, #b80048 50%, #8a0035 100%);
        }
        .text-stroke-thick {
            -webkit-text-stroke: 6px #000;
            paint-order: stroke fill;
        }
        .text-stroke-white {
            -webkit-text-stroke: 4px #ffffff;
            paint-order: stroke fill;
        }
        .banner-gradient {
            background: linear-gradient(90deg, #056a33 0%, #0b8a43 50%, #056a33 100%);
        }
        .gold-yellow-gradient {
            background: linear-gradient(to bottom, #ffea00 0%, #ffcc00 50%, #e69500 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .curved-green-bg {
            background-color: #0b9e43;
            border-radius: 50% 50% 0 0 / 20% 20% 0 0;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-2 sm:p-4">

    <!-- Poster Container (Simulating standard vertical poster ratio) -->
    <div class="relative w-full max-w-[440px] aspect-[1/1.45] poster-bg rounded-3xl shadow-2xl overflow-hidden flex flex-col justify-between p-4 sm:p-6 text-white select-none">

        <!-- Decorative Background Sweeping Green Waves -->
        <div class="absolute inset-x-0 top-[25%] h-[60%] bg-[#0ea543] rounded-[100%] scale-150 z-0 opacity-90 pointer-events-none transform -rotate-6"></div>
        <div class="absolute inset-x-0 top-[30%] h-[55%] bg-[#056a33] rounded-[100%] scale-150 z-0 opacity-80 pointer-events-none transform rotate-3"></div>

        <!-- TOP SECTION: Icons & Title -->
        <div class="relative z-10 flex flex-col items-center">
            
            <!-- Top Floating Decorative Shopping Icons & Yellow Flashes -->
            <div class="w-full flex justify-between items-center px-4 mb-1">
                <!-- Left Bag Icon -->
                <div class="bg-pink-600/60 p-2 rounded-2xl border border-pink-400 shadow-md transform -rotate-12">
                    <i class="fa-solid fa-bag-shopping text-yellow-300 text-lg"></i>
                </div>
                
                <!-- Center Shopping Cart -->
                <div class="flex flex-col items-center">
                    <div class="relative bg-white text-pink-600 px-3 py-1.5 rounded-2xl border-4 border-pink-600 shadow-xl transform hover:scale-105 transition">
                        <i class="fa-solid fa-cart-shopping text-2xl"></i>
                        <span class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-yellow-400 rounded-full animate-ping"></span>
                    </div>
                </div>

                <!-- Right T-shirt Icon -->
                <div class="bg-pink-600/60 p-2 rounded-2xl border border-pink-400 shadow-md transform rotate-12">
                    <i class="fa-solid fa-shirt text-yellow-300 text-lg"></i>
                </div>
            </div>

            <!-- Yellow Flash Accents around Cart -->
            <div class="w-full flex justify-between px-16 -mt-2 mb-1">
                <div class="w-6 h-2 bg-yellow-300 transform -rotate-45 rounded-full"></div>
                <div class="w-6 h-2 bg-yellow-300 transform rotate-45 rounded-full"></div>
            </div>

            <!-- STORE TITLE: KHERWAL BAZAAR -->
            <div class="text-center relative my-1">
                <!-- Green Accent Dashes under title -->
                <div class="absolute -bottom-2 left-0 right-0 flex justify-between px-6 opacity-80 pointer-events-none">
                    <div class="w-12 h-3 bg-green-500 transform -rotate-12 rounded-full"></div>
                    <div class="w-12 h-3 bg-green-500 transform rotate-12 rounded-full"></div>
                </div>

                <!-- KHERWAL (White bold text with thick black & pink outlines) -->
                <h1 class="text-4xl sm:text-5xl font-black italic tracking-wider text-white drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)]" style="-webkit-text-stroke: 6px #000; paint-order: stroke fill;">
                    KHERWAL
                </h1>
                <!-- BAZAAR (Golden Yellow gradient with heavy black outline) -->
                <h2 class="text-4xl sm:text-5xl font-black italic tracking-wider gold-yellow-gradient drop-shadow-[0_5px_5px_rgba(0,0,0,0.9)] -mt-2" style="-webkit-text-stroke: 5px #000; paint-order: stroke fill;">
                    BAZAAR
                </h2>
            </div>

            <!-- SCAN QR CODE & PAY BANNER -->
            <div class="mt-2 relative z-20 w-full max-w-[320px]">
                <div class="banner-gradient py-2.5 px-6 rounded-full text-center border-2 border-yellow-300 shadow-xl flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-qrcode text-yellow-300 text-lg animate-pulse"></i>
                    <span class="text-white font-extrabold text-base sm:text-lg tracking-wide uppercase drop-shadow">Scan QR Code & Pay</span>
                </div>
            </div>
        </div>

        <!-- CENTER SECTION: QR CODE CARD -->
        <div class="relative z-10 flex justify-center my-auto py-2">
            <div class="bg-white p-4 rounded-3xl shadow-2xl border-4 border-pink-600 relative w-[260px] sm:w-[280px] aspect-square flex items-center justify-center">
                
                <!-- Corner Pink L-Brackets -->
                <div class="absolute top-2 left-2 w-6 h-6 border-t-4 border-l-4 border-pink-600 rounded-tl-lg"></div>
                <div class="absolute top-2 right-2 w-6 h-6 border-t-4 border-r-4 border-pink-600 rounded-tr-lg"></div>
                <div class="absolute bottom-2 left-2 w-6 h-6 border-b-4 border-l-4 border-pink-600 rounded-bl-lg"></div>
                <div class="absolute bottom-2 right-2 w-6 h-6 border-b-4 border-r-4 border-pink-600 rounded-br-lg"></div>

                <!-- Mock QR Code Matrix using CSS Grid -->
                <div class="w-full h-full bg-white p-2 grid grid-cols-7 gap-1.5 items-center justify-center">
                    <!-- Row 1 -->
                    <div class="bg-black col-span-2 row-span-2 rounded-sm relative p-1 border-2 border-white"><div class="w-full h-full bg-white rounded-xs"></div></div>
                    <div class="bg-black h-full rounded-xs"></div>
                    <div class="bg-black h-full rounded-xs"></div>
                    <div class="bg-black h-full rounded-xs"></div>
                    <div class="bg-black col-span-2 row-span-2 rounded-sm relative p-1 border-2 border-white"><div class="w-full h-full bg-white rounded-xs"></div></div>
                    
                    <!-- Row 2 -->
                    <div class="bg-black h-full rounded-xs"></div>
                    <div class="bg-black h-full rounded-xs"></div>
                    
                    <!-- Row 3 -->
                    <div class="bg-black h-full rounded-xs"></div>
                    <div class="bg-black h-full rounded-xs"></div>
                    <div class="bg-black h-full rounded-xs"></div>
                    <div class="bg-black h-full rounded-xs"></div>
                    <div class="bg-black h-full rounded-xs"></div>
                    <div class="bg-black h-full rounded-xs"></div>
                    <div class="bg-black h-full rounded-xs"></div>

                    <!-- Row 4 -->
                    <div class="bg-black col-span-2 row-span-2 rounded-sm relative p-1 border-2 border-white"><div class="w-full h-full bg-white rounded-xs"></div></div>
                    <div class="bg-black h-full rounded-xs"></div>
                    <div class="bg-black h-full rounded-xs"></div>
                    <div class="bg-black h-full rounded-xs"></div>
                    <div class="bg-black h-full rounded-xs"></div>
                    <div class="bg-black h-full rounded-xs"></div>

                    <!-- Row 5 -->
                    <div class="bg-black h-full rounded-xs"></div>
                    <div class="bg-black h-full rounded-xs"></div>
                    <div class="bg-black h-full rounded-xs"></div>
                    <div class="bg-black h-full rounded-xs"></div>

                    <!-- Row 6 -->
                    <div class="bg-black h-full rounded-xs"></div>
                    <div class="bg-black h-full rounded-xs"></div>
                    <div class="bg-black h-full rounded-xs"></div>
                    <div class="bg-black h-full rounded-xs"></div>
                    <div class="bg-black h-full rounded-xs"></div>
                    <div class="bg-black h-full rounded-xs"></div>
                    <div class="bg-black h-full rounded-xs"></div>
                </div>

                <!-- Center Brand Logo watermark on QR -->
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <div class="bg-white px-2 py-1 rounded-md shadow border border-gray-200 text-pink-600 font-black text-xs">
                        KB
                    </div>
                </div>
            </div>
        </div>

        <!-- LOWER SECTION: Payment Apps & Features Footer -->
        <div class="relative z-10 flex flex-col space-y-2.5 mt-2">
            
            <!-- Payment Provider Logos Card -->
            <div class="bg-white rounded-2xl py-2 px-3 shadow-lg flex items-center justify-between text-black">
                <!-- G Pay -->
                <div class="flex flex-col items-center flex-1 border-r border-gray-300 pr-1">
                    <div class="flex items-center space-x-1">
                        <span class="text-blue-600 font-extrabold text-lg">G</span>
                        <span class="text-red-500 font-extrabold text-lg">P</span>
                        <span class="text-yellow-500 font-extrabold text-lg">a</span>
                        <span class="text-green-600 font-extrabold text-lg">y</span>
                    </div>
                    <span class="text-[11px] font-bold text-gray-800 -mt-0.5">G Pay</span>
                </div>

                <!-- PhonePe -->
                <div class="flex flex-col items-center flex-1 border-r border-gray-300 px-1">
                    <div class="bg-purple-700 text-white w-7 h-7 rounded-full flex items-center justify-center font-bold text-sm shadow">
                        पे
                    </div>
                    <span class="text-[11px] font-bold text-gray-800 mt-0.5">PhonePe</span>
                </div>

                <!-- Paytm -->
                <div class="flex flex-col items-center flex-1 border-r border-gray-300 px-1">
                    <div class="flex items-center font-black italic text-xs tracking-tighter">
                        <span class="text-blue-900">Pay</span><span class="text-cyan-400">tm</span>
                    </div>
                    <span class="text-[11px] font-bold text-gray-800 mt-0.5">Paytm</span>
                </div>

                <!-- UPI -->
                <div class="flex flex-col items-center flex-1 pl-1">
                    <div class="flex items-center text-xs font-black italic text-gray-800">
                        <span>UPI</span>
                        <div class="flex ml-0.5">
                            <div class="w-1.5 h-3 bg-orange-500 transform skew-x-12"></div>
                            <div class="w-1.5 h-3 bg-green-600 transform skew-x-12"></div>
                        </div>
                    </div>
                    <span class="text-[11px] font-bold text-gray-800 mt-0.5">UPI</span>
                </div>
            </div>

            <!-- Enhanced Features Banner Section -->
            <div class="bg-black/25 backdrop-blur-md rounded-2xl p-2 border border-white/10 shadow-xl">
                <div class="grid grid-cols-4 gap-1 text-center text-white">
                    <!-- Feature 1 -->
                    <div class="flex flex-col items-center border-r border-white/20 pr-1">
                        <div class="bg-white/20 p-2 rounded-xl mb-1 shadow-inner">
                            <i class="fa-solid fa-shield-halved text-yellow-300 text-base"></i>
                        </div>
                        <span class="text-[10px] sm:text-xs font-extrabold leading-tight tracking-tight">Secure Payment</span>
                    </div>

                    <!-- Feature 2 -->
                    <div class="flex flex-col items-center border-r border-white/20 px-1">
                        <div class="bg-white/20 p-2 rounded-xl mb-1 shadow-inner">
                            <i class="fa-solid fa-bolt text-yellow-300 text-base"></i>
                        </div>
                        <span class="text-[10px] sm:text-xs font-extrabold leading-tight tracking-tight">Fast Checkout</span>
                    </div>

                    <!-- Feature 3 -->
                    <div class="flex flex-col items-center border-r border-white/20 px-1">
                        <div class="bg-white/20 p-2 rounded-xl mb-1 shadow-inner">
                            <i class="fa-solid fa-truck-fast text-yellow-300 text-base"></i>
                        </div>
                        <span class="text-[10px] sm:text-xs font-extrabold leading-tight tracking-tight">Home Delivery</span>
                    </div>

                    <!-- Feature 4 -->
                    <div class="flex flex-col items-center pl-1">
                        <div class="bg-white/20 p-2 rounded-xl mb-1 shadow-inner">
                            <i class="fa-solid fa-bag-shopping text-yellow-300 text-base"></i>
                        </div>
                        <span class="text-[10px] sm:text-xs font-extrabold leading-tight tracking-tight">Wide Products</span>
                    </div>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
